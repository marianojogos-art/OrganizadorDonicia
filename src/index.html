dding:10px 14px;font-weight:700}.button:hover{background:#0b4775}.button.secondary{background:#e5eff7;color:#1b547e}.button.outline{border:1px solid #b8cedd;background:#fff;color:#20597f}.grid{display:grid;gap:17px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.metric{background:white;border:1px solid #d8e5ee;border-radius:14px;padding:18px 20px;box-shadow:0 3px 12px #163f6208}.metric b{display:block;font-size:30px;letter-spacing:-.04em;margin-top:8px}.metric span{font-size:14px;color:#58768e;font-weight:600}.dashboard{grid-template-columns:1.3fr 1fr}.card{background:white;border:1px solid #d8e5ee;border-radius:15px;padding:22px;box-shadow:0 3px 12px #163f6208;min-width:0}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.cardhead h2{margin:0}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid #e8eff4}.row:first-child{border-top:0}.row strong{display:block;line-height:1.3}.row p{margin:5px 0 0;font-size:14px;color:#607b91}.stack{display:grid;gap:17px}.notice{background:#e6f1fb;border-left:4px solid #2473aa;padding:12px 15px;border-radius:8px;font-size:14px;color:#24587e;margin-bottom:20px}.notice a{font-weight:750}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px;flex-wrap:wrap}.toolbar p{margin:0}.tabs{display:flex;gap:5px;background:#dce9f1;border-radius:10px;padding:4px}.tabs button{border:0;background:none;color:#476983;border-radius:7px;padding:8px 11px;font-size:14px;font-weight:700}.tabs button.active{background:white;color:#124973;box-shadow:0 1px 4px #1234}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;text-align:left}.table th{background:#f2f7fa;color:#53728a;font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding:13px}.table td{padding:14px 13px;border-bottom:1px solid #e7eef3;font-size:14px;vertical-align:top}.table tr:last-child td{border:0}.sectiongrid{grid-template-columns:repeat(2,minmax(0,1fr))}.spacegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.space{border:1px solid #dbe7ef;border-radius:11px;padding:15px;background:#fafcfe}.space strong{display:block}.space p{margin:6px 0 12px;font-size:14px;color:#607b91}.small{font-size:13px}.empty{padding:32px;text-align:center;color:#607b91;border:1px dashed #cadce8;border-radius:10px;background:#f9fcfe}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px;font-size:14px;font-weight:700;color:#395b76}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;border:1px solid #b9cddc;background:white;color:#18374f;border-radius:9px;padding:10px 11px;min-height:43px}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}.alert{color:#9a4237;font-size:14px}.progress{height:9px;background:#e4edf3;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{height:100%;background:#2c83b7;display:block}.modalback{position:fixed;inset:0;background:#082a4c99;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:white;border-radius:17px;padding:25px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #001e3470}.modalhead{display:flex;align-items:start;justify-content:space-between;gap:15px;margin-bottom:16px}.modalhead h2{margin:0}.close{border:0;background:#e9f1f6;width:30px;height:30px;border-radius:7px;color:#345a76}.demo{font-size:13px;color:#647f94;line-height:1.5}.toast{position:fixed;bottom:20px;right:20px;background:#143e65;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 8px 24px #102c4a50;z-index:10}.hidden{display:none!important}@media(max-width:960px){.app{grid-template-columns:1fr}.side{padding:15px;gap:12px}.brand{padding:0}.nav{flex-direction:row;overflow:auto;scrollbar-width:thin}.nav button{width:auto;white-space:nowrap}.sidefoot{display:none}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard,.sectiongrid{grid-template-columns:1fr}}@media(max-width:600px){.main{padding:19px 14px 35px}.metrics,.spacegrid,.formgrid{grid-template-columns:1fr}.top{align-items:flex-start}.today{display:none}.card{padding:17px}.field.full{grid-column:auto}}
  /* Modern school workspace: quiet surfaces, clear actions and keyboard cues. */
  :root{color-scheme:light}body{background:#f4f7fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.side{background:linear-gradient(155deg,#102f4e,#16476c);border-right:1px solid #ffffff18}.mark{border-radius:14px;background:#fff;color:#174569;box-shadow:0 6px 20px #071e3433}.main{max-width:1440px;width:100%;margin:auto}.card,.space,.metric{box-shadow:0 3px 16px #142c4806;border:1px solid #dbe5ef}.card{border-radius:18px}.metric b{font-size:34px;letter-spacing:-.04em}.button{min-height:44px;border-radius:10px;font-weight:750;transition:background .15s,transform .15s}.button:hover{filter:brightness(.95)}.button:active{transform:translateY(1px)}button:disabled{opacity:.55;cursor:wait}.button.secondary{background:#edf4fa;color:#174e75}.nav button{min-height:46px;border-radius:10px}.nav button.active{background:#fff;color:#153f60}.notice{background:#eaf4fb;color:#214f70;border:1px solid #cde3f1;line-height:1.6}.field input,.field select{border-color:#a9bdcf}.field input:focus,.field select:focus{outline:3px solid #b5d8f0;border-color:#246b99}button:focus-visible,a:focus-visible{outline:3px solid #f6b949;outline-offset:3px}.alert{background:#fff0ed;padding:12px;border-radius:8px;color:#8a2d25}.empty{padding:36px 20px;line-height:1.6}.modalhead{padding-bottom:12px;border-bottom:1px solid #e4edf4}.modal{border-radius:20px}.muted,.demo,.small{color:#526e84}.table td{line-height:1.5}.row p{line-height:1.5}.space p{min-height:40px;line-height:1.6}.today{color:#48677e}.sidefoot{color:#d4e5f1}h1{letter-spacing:-.035em}h2{letter-spacing:-.02em}@media(max-width:600px){.nav{gap:5px}.nav button{font-size:13px}.toolbar>.button{width:100%}.modal{padding:20px}.actions>.button{flex:1}.notice{font-size:13px}.metric b{font-size:30px}.cardhead{align-items:flex-start}.row{gap:10px;flex-wrap:wrap}}

<body>
<div class="app">
  <aside class="side"><div class="brand"><div class="mark">D</div><div><strong>Donícia</strong><small>Gestão escolar</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot">EBM Donícia Maria da Costa<br>Organizador da equipe escolar</div></aside>
  <main class="main"><header class="top"><div><p class="eyebrow">EBM Donícia Maria da Costa</p><h1 id="title">Visão do dia</h1><div class="muted" id="subtitle">O que precisa de atenção na escola.</div></div><div class="today" id="date"></div></header><div class="notice">Ambiente de teste. Os registros são salvos no banco. Use somente dados fictícios. <a href="https://www.webhorario.com.br/gradeporprofs.php?id=7829" target="_blank" rel="noopener noreferrer">Abrir a grade no WebHorário ↗</a></div><div id="page"></div></main>
</div><div id="modalroot"></div><div id="toastroot"></div>
<script>
const sections=[['inicio','Visão do dia'],['substituicoes','Substituições'],['espacos','Espaços'],['tarefas','Tarefas'],['xerox','Xerox'],['atas','Atas'],['calendario','Calendário']];
const spaces=['Biblioteca','Auditório','Sala de informática','Laboratório de ciências','Sala de jogos','Sala de projetos','Quadra coberta','Quadra descoberta'];
const today=new Date();const iso=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(today);const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR');
const state={section:'inicio',aux:[{name:'Auxiliar A',weekly:26},{name:'Auxiliar B',weekly:31},{name:'Auxiliar C',weekly:18}],subs:[{date:iso,slot:'08:15–09:00',class:'Turma 61',teacher:'Professora titular',aux:'Auxiliar A',status:'Confirmada'},{date:iso,slot:'10:00–10:45',class:'Turma 52',teacher:'Professor titular',aux:'',status:'Pendente'}],bookings:[{space:'Biblioteca',date:iso,start:'09:00',end:'10:00',owner:'Equipe pedagógica',purpose:'Leitura orientada'}],tasks:[{title:'Organizar pauta da reunião pedagógica',owner:'Supervisão',due:iso,status:'Em andamento',restricted:false},{title:'Conferir calendário do mês',owner:'Direção',due:iso,status:'Pendente',restricted:false}],late:[],absence:[],xerox:[{title:'Atividade de leitura',requester:'Professora',copies:30,deadline:iso,status:'Aguardando aprovação'}],minutes:[],events:[{date:iso,title:'Reunião pedagógica',type:'Reunião'}]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,kind='')=>`<button class="button ${kind}" data-action="${action}">${label}</button>`;
function setPage(id){state.section=id;render()}
function nav(){document.querySelector('#nav').innerHTML=sections.map(([id,label])=>`<button data-section="${id}" class="${id===state.section?'active':''}">${label}</button>`).join('')}
function card(title,inner,extra=''){return `<section class="card"><div class="cardhead"><h2>${title}</h2>${extra}</div>${inner}</section>`}
function item(title,detail,badge,badgeClass=''){return `<div class="row"><div><strong>${esc(title)}</strong><p>${esc(detail)}</p></div>${badge?`<span class="badge ${badgeClass}">${esc(badge)}</span>`:''}</div>`}
function dashboard(){return `<div class="grid metrics"><div class="metric"><span>Aulas sem auxiliar</span><b>${state.subs.filter(x=>x.date===iso&&!x.aux).length}</b></div><div class="metric"><span>Xerox aguardando aprovação</span><b>${state.xerox.filter(x=>x.status==='Aguardando aprovação').length}</b></div><div class="metric"><span>Tarefas pendentes</span><b>${state.tasks.filter(x=>x.status!=='Concluída').length}</b></div><div class="metric"><span>Reservas de hoje</span><b>${state.bookings.filter(x=>x.date===iso).length}</b></div></div><div class="grid dashboard">${card('Substituições de hoje',state.subs.filter(x=>x.date===iso).map(x=>item(x.class+' · '+x.slot,x.teacher+(x.aux?' → '+x.aux:''),x.status,x.aux?'good':'warn')).join('')||'<div class="empty">Nenhuma substituição hoje.</div>',btn('Ver todas','substituicoes','secondary'))}<div class="stack">${card('Tarefas',state.tasks.filter(x=>x.status!=='Concluída').slice(0,3).map(x=>item(x.title,x.owner+' · prazo '+fmtDate(x.due),x.status,x.status==='Pendente'?'warn':'')).join('')||'<div class="empty">Sem tarefas pendentes.</div>',btn('Ver tarefas','tarefas','secondary'))}${card('Agenda e espaços',state.events.filter(x=>x.date===iso).map(x=>item(x.title,x.type,'Hoje')).join('')+[...state.bookings.filter(x=>x.date===iso),...fixedToday()].map(x=>item(x.space,x.start+'–'+x.end+' · '+x.owner,'Reservado','good')).join('')||'<div class="empty">Sem compromissos hoje.</div>')}</div></div>`}
function substitutions(){return `<div class="toolbar"><p class="muted">Aulas da grade e distribuição de auxiliares.</p>${currentUser?.role==='direction'?btn('Registrar ausência','new-sub'):''}</div>${card('Aulas a cobrir',`<div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Horário</th><th>Turma</th><th>Professor</th><th>Auxiliar</th><th>Situação</th></tr></thead><tbody>${state.subs.map((x,i)=>`<tr><td>${fmtDate(x.date)}<br>${controls('substitutions',i)}</td><td>${esc(x.slot)}</td><td>${esc(x.class)}</td><td>${esc(x.teacher)}</td><td>${x.aux?esc(x.aux)+(currentUser?.role==='direction'?`<div class="actions"><button class="button secondary small" data-assign="${i}">Trocar</button><button class="button outline small" data-unassign="${i}">Retirar auxiliar</button></div>`:''):currentUser?.role!=='direction'?'Aguardando direção':`<button class="button secondary" data-assign="${i}">Distribuir</button>`}</td><td><span class="badge ${x.aux?'good':'warn'}">${x.status}</span></td></tr>`).join('')}</tbody></table></div>`)}<div style="height:17px"></div>${card('Carga das auxiliares nesta semana',`${currentUser?.role==='direction'?btn('Cadastrar auxiliar','new-aux','secondary'):''}<div class="grid sectiongrid">${state.aux.map((x,i)=>`<div>${controls('auxiliaries',i)}<strong>${esc(x.name)}</strong><div class="small muted">${x.weekly} de ${weeklyLimit} aulas · ${weeklyLimit-x.weekly} ${weeklyLimit-x.weekly===1?'disponível':'disponíveis'}</div><div class="progress"><i style="width:${x.weekly/weeklyLimit*100}%"></i></div></div>`).join('')}</div><p class="demo">O limite semanal é configurado pela escola. Horários sobrepostos são bloqueados pelo banco.</p>`)}`}
async function cancelBooking(id){if(!confirm('Cancelar esta reserva? O espaço ficará disponível.'))return;try{await api('reservations/'+encodeURIComponent(id),'DELETE',{version:state.bookings.find(x=>x.id===id).version});toast('Reserva cancelada.');try{await refresh()}catch{markStale()}}catch(e){toast(e.message)}}
function fixedToday(){return state.fixed.filter(x=>x.weekday===new Date(iso+'T12:00:00Z').getUTCDay()&&x.from_date<=iso&&x.to_date>=iso).map(x=>({...x,owner:'Horário fixo: '+x.purpose}))}
function roomToday(space){return [...state.bookings.filter(x=>x.space===space&&x.date===iso),...fixedToday().filter(x=>x.space===space)].sort((a,b)=>a.start.localeCompare(b.start))}
function roomPage(){return `<div class="toolbar"><p class="muted">Reservas pontuais e ocupação dos ambientes.</p>${btn('Nova reserva','new-booking')}</div><div class="spacegrid">${spaces.map(s=>`<div class="space"><strong>${s}</strong><p>${roomToday(s).length?roomToday(s).map(x=>esc(x.start+'–'+x.end+' · '+x.owner)).join(', '):'Sem reserva para hoje'}</p><button class="button secondary" data-space="${esc(s)}">Reservar</button></div>`).join('')}</div><div style="height:17px"></div>${card('Próximas reservas',state.bookings.map((x,i)=>x.date<iso?'':`<div>${controls('reservations',i)}${item(x.space,fmtDate(x.date)+' · '+x.start+'–'+x.end+' · '+x.owner,x.purpose)}${currentUser&&(currentUser.role==='direction'||x.ownerEmail===currentUser.email)?`<button class="button outline small" data-cancel-booking="${esc(x.id)}">Cancelar reserva</button>`:''}</div>`).join('')||'<div class="empty">Nenhuma reserva.</div>')}<div style="height:17px"></div>${card('Horários fixos',`${currentUser?.role==='direction'?btn('Definir horário fixo','new-fixed','secondary'):''}${state.fixed.map((x,i)=>controls('fixed-occupancy',i)+item(x.space,['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][x.weekday]+' · '+x.start+'–'+x.end+' · '+fmtDate(x.from_date)+' a '+fmtDate(x.to_date),x.purpose)).join('')||'<div class="empty">Nenhum horário fixo. Use reservas para encontros pontuais.</div>'}`)}<p class="demo">Reservas e horários fixos conflitantes são bloqueados.</p>`}
function tasksPage(){return `<div class="toolbar"><p class="muted">Acompanhamento das demandas da equipe.</p>${btn('Nova tarefa','new-task')}</div>${card('Tarefas',state.tasks.map((x,i)=>`<div class="row"><div>${controls('tasks',i)}<strong>${esc(x.title)}</strong><p>${esc(x.owner)} · prazo ${fmtDate(x.due)} ${x.restricted?'· acesso restrito':''}</p></div>${currentUser?.role==='direction'||x.ownerEmail===currentUser?.email?`<button class="button secondary" data-task="${i}">${esc(x.status)}</button>`:`<span class="badge">${esc(x.status)}</span>`}</div>`).join('')||'<div class="empty">Nenhuma tarefa.</div>')}<p class="demo">Apenas a direção pode restringir a visibilidade ou delegar tarefas. A autorização é nominal, com perfis de direção e professor.</p>`}
function studentsPage(){return '<div class="empty">Dados de estudantes desabilitados. Definir finalidade, acesso e autorização antes de usar informações reais.</div>';return `<div class="grid sectiongrid">${card('Chegadas tardias',`${btn('Registrar chegada','new-late')}<div style="height:12px"></div>${state.late.map(x=>item(x.student+' · '+x.class,fmtDate(x.date)+' · '+x.time,x.reason)).join('')||'<div class="empty">Nenhum registro nesta sessão.</div>'}`)}${card('Ausências justificadas',`${btn('Registrar justificativa','new-absence')}<div style="height:12px"></div>${state.absence.map(x=>item(x.student+' · '+x.class,fmtDate(x.start)+' a '+fmtDate(x.end),x.reason)).join('')||'<div class="empty">Nenhum registro nesta sessão.</div>'}`)}</div><p class="demo">A frequência oficial será importada do SGE futuramente. Os registros desta tela não alteram a frequência.</p>`}
function xeroxPage(){return `<div class="toolbar"><p class="muted">Peça o material. A direção aprova antes da produção.</p>${btn('Novo pedido','new-xerox')}</div>${card('Pedidos de xerox',state.xerox.map((x,i)=>`<div class="row"><div>${controls('xerox',i)}<strong>${esc(x.title)}</strong><p>${esc(x.requester)} · ${x.copies} cópias · prazo ${fmtDate(x.deadline)}</p></div>${currentUser?.role==='direction'?`<button class="button secondary" data-xerox="${i}">${esc(x.status)}</button>`:x.status==='Devolvido para ajustes'?`<button class="button secondary" data-revise-xerox="${i}">Ajustar e reenviar</button>`:`<span class="badge">${esc(x.status)}</span>`}</div>`).join('')||'<div class="empty">Nenhum pedido.</div>')}<p class="demo">Somente a direção pode aprovar, devolver ou atualizar a produção.</p>`}
function minutesPage(){return `<div class="toolbar"><p class="muted">Reuniões, decisões e encaminhamentos.</p>${currentUser?.role==='direction'?btn('Nova ata','new-minute'):''}</div>${card('Atas de reuniões',state.minutes.map((x,i)=>controls('minutes',i)+item(x.title,fmtDate(x.date)+' · '+x.participants,x.decisions)).join('')||'<div class="empty">Nenhuma ata registrada nesta sessão.</div>')}`}
function calendarPage(){return `<div class="toolbar"><p class="muted">Datas letivas e compromissos da escola.</p>${currentUser?.role==='direction'?btn('Adicionar evento','new-event'):''}</div>${card('Calendário escolar',state.events.sort((a,b)=>a.date.localeCompare(b.date)).map((x,i)=>controls('events',i)+item(x.title,fmtDate(x.date),x.type)).join('')||'<div class="empty">Nenhum evento registrado.</div>')}`}
const pages={inicio:dashboard,substituicoes:substitutions,espacos:roomPage,tarefas:tasksPage,estudantes:studentsPage,xerox:xeroxPage,atas:minutesPage,calendario:calendarPage};
function render(){nav();if(stale){document.querySelector('#page').innerHTML='<div class="empty" role="status">A alteração foi salva. Atualize a lista para continuar.<div class="actions"><button class="button" data-refresh>Atualizar lista</button></div></div>';return}document.querySelector('#title').textContent=sections.find(x=>x[0]===state.section)[1];document.querySelector('#subtitle').textContent=state.section==='inicio'?'O que precisa de atenção na escola.':'';document.querySelector('#date').textContent=today.toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo',weekday:'long',day:'numeric',month:'long',year:'numeric'});document.querySelector('#page').innerHTML=pages[state.section]();}
const field=(name,label,type='text',value='',extra='')=>{const max={teacher:100,class:80,name:100,participants:2000,decisions:4000}[name]||250;if(['participants','decisions'].includes(name))return `<label class="field ${extra}">${label}<textarea name="${name}" maxlength="${max}" required>${esc(value)}</textarea></label>`;return `<label class="field ${extra}">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="1" max="10000" step="1"':type==='text'?`maxlength="${max}"`:''} required></label>`};
const select=(name,label,opts)=>`<label class="field">${label}<select name="${name}" required>${opts.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label>`;
function formContent(type,arg){switch(type){case'new-sub':return `<p class="demo">Consulte a grade do WebHorário para confirmar as aulas afetadas.</p><div class="formgrid">${field('date','Data','date',iso)}${field('teacher','Professor ausente')}${field('class','Turma')}${field('slot','Horário (ex.: 08:15–09:00)')}</div>`;case'assign':return `<p>${esc(state.subs[arg].class)} · ${esc(state.subs[arg].slot)}</p><div class="formgrid">${select('aux','Auxiliar',state.aux.map(x=>x.name))}</div><p class="demo">A distribuição é bloqueada ao ultrapassar 32 aulas na semana.</p>`;case'new-booking':return `<div class="formgrid">${select('space','Espaço',arg?[arg,...spaces.filter(x=>x!==arg)]:spaces)}${field('date','Data','date',iso)}${field('start','Início','time')}${field('end','Término','time')}${field('owner','Responsável')}${field('purpose','Atividade')}</div>`;case'new-task':return `<div class="formgrid">${field('title','Tarefa','text','','full')}${field('owner','Responsável')}${field('due','Prazo','date',iso)}${select('visibility','Visibilidade',['Toda a equipe','Restrita — demonstração'])}</div>`;case'new-late':return `<div class="formgrid">${field('student','Estudante')}${field('class','Turma')}${field('date','Data','date',iso)}${field('time','Horário de chegada','time')}${field('reason','Motivo','text','','full')}</div>`;case'new-absence':return `<div class="formgrid">${field('student','Estudante')}${field('class','Turma')}${field('start','Primeiro dia','date',iso)}${field('end','Último dia','date',iso)}${field('reason','Justificativa','text','','full')}</div>`;case'new-xerox':return `<div class="formgrid">${field('title','Material','text','','full')}${field('requester','Solicitante')}${field('copies','Número de cópias','number')}${field('deadline','Prazo','date',iso)}</div>`;case'new-minute':return `<div class="formgrid">${field('title','Reunião','text','','full')}${field('date','Data','date',iso)}${field('participants','Participantes','text','','full')}${field('decisions','Decisões e encaminhamentos','text','','full')}</div>`;case'new-event':return `<div class="formgrid">${field('title','Evento','text','','full')}${field('date','Data','date',iso)}${select('type','Tipo',['Reunião','Dia letivo','Feriado','Recesso','Conselho de classe','Evento escolar'])}</div>`;case'task':return `<p>${esc(state.tasks[arg].title)}</p>${select('status','Situação',['Pendente','Em andamento','Concluída'])}`;case'xerox':return `<p>${esc(state.xerox[arg].title)}</p>${select('status','Situação',['Aguardando aprovação','Aprovado','Devolvido para ajustes','Recusado','Em produção','Concluído'])}`}}
function modal(type,arg){const titles={'new-sub':'Registrar ausência','assign':'Distribuir aula','new-booking':'Nova reserva','new-task':'Nova tarefa','new-late':'Chegada tardia','new-absence':'Ausência justificada','new-xerox':'Pedido de xerox','new-minute':'Nova ata','new-event':'Novo evento',task:'Atualizar tarefa',xerox:'Atualizar pedido','revise-xerox':'Ajustar e reenviar pedido','new-fixed':'Horário fixo','edit-reservations':'Editar reserva','edit-tasks':'Editar tarefa','edit-substitutions':'Editar aula ausente','edit-auxiliaries':'Editar auxiliar','edit-xerox':'Editar pedido de xerox','edit-minutes':'Editar ata','edit-events':'Editar evento','edit-fixed-occupancy':'Editar horário fixo'};document.querySelector('#modalroot').innerHTML=`<div class="modalback"><div class="modal" role="dialog" aria-modal="true" aria-label="${titles[type]||'Editar registro'}"><div class="modalhead"><h2>${titles[type]||'Editar registro'}</h2><button class="close" data-close aria-label="Fechar">×</button></div><form id="entryform">${formContent(type,arg)}<div class="actions"><button class="button" type="submit">Salvar nesta sessão</button><button class="button outline" type="button" data-close>Cancelar</button></div><p class="alert hidden" id="formerror" role="alert"></p></form></div></div>`;document.querySelector('#entryform').onsubmit=e=>{e.preventDefault();save(type,arg,new FormData(e.target))};document.querySelector('.modalback').onclick=e=>{if(e.target.classList.contains('modalback')||e.target.closest('[data-close]'))closeModal()}}
function error(msg){let x=document.querySelector('#formerror');if(!x){toast(msg);return}x.textContent=msg;x.classList.remove('hidden')}
let lastFocus=null;function closeModal(force=false){if(busy&&force!==true)return;document.querySelector('#modalroot').innerHTML='';lastFocus?.focus()}
function toast(msg){document.querySelector('#toastroot').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;setTimeout(()=>document.querySelector('#toastroot').innerHTML='',3300)}
let currentUser=null, users=[],weeklyLimit=32,stale=false,busy=false;
function setBusy(value){busy=value;for(const b of document.querySelectorAll('.modal button'))b.disabled=value}state.fixed=[];
const entities={reservations:'bookings',tasks:'tasks',substitutions:'subs',auxiliaries:'aux','fixed-occupancy':'fixed',xerox:'xerox',minutes:'minutes',events:'events'};
function controls(entity,i){const x=state[entities[entity]][i];if(!currentUser)return '';const owner=x.ownerEmail||x.requesterEmail;if(currentUser.role!=='direction'&&owner!==currentUser.email)return '';if(entity==='xerox'&&!['Aguardando aprovação','Devolvido para ajustes'].includes(x.status))return '';return `<button class="button outline small" data-edit="${entity}:${i}">Editar</button>`}
async function removeRecord(entity,i){if(busy)return;const x=state[entities[entity]][i];if(!confirm(entity==='auxiliaries'?'Desativar esta auxiliar? As aulas futuras dela ficarão pendentes.':'Remover este registro? Esta ação libera o horário ou encerra o item.'))return;setBusy(true);try{await api(entity+'/'+encodeURIComponent(x.id),'DELETE',{version:x.version});closeModal(true);toast('Registro removido.');try{await refresh()}catch{markStale()}}catch(e){error(e.message)}finally{setBusy(false)}}
async function api(path,method='GET',data){const r=await fetch('/api/'+path,{method,headers:method==='GET'?{}:{'Content-Type':'application/json'},body:method==='GET'?undefined:JSON.stringify(data||{})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível concluir');return d}
function weekOf(date){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10)}
function markStale(){stale=true;render()}
async function unassign(index){const x=state.subs[index];if(!confirm('Retirar esta auxiliar? A aula ficará pendente.'))return;try{await api('substitutions/'+encodeURIComponent(x.id),'PATCH',{auxiliary:null,version:x.version});toast('Auxiliar retirada.');try{await refresh()}catch{markStale()}}catch(e){toast(e.message)}}
async function refresh(){const [bookings,tasks,subs,aux,xerox,minutes,events,fixed,settings]=await Promise.all(['reservations','tasks','substitutions','auxiliaries','xerox','minutes','events','fixed-occupancy','settings'].map(x=>api(x)));state.fixed=fixed;weeklyLimit=settings.auxiliaryWeeklyLimit;state.subs=subs.map(x=>({...x,slot:x.start+'–'+x.end,status:x.auxiliary?'Confirmada':'Pendente',aux:x.aux||''}));state.aux=aux.map(x=>({...x,weekly:subs.filter(y=>y.auxiliary===x.id&&y.week===weekOf(iso)).length}));state.xerox=xerox.map(x=>({...x,requesterEmail:x.requester,requester:x.requester_name}));state.minutes=minutes;state.events=events;state.bookings=bookings.map(x=>({...x,ownerEmail:x.owner,owner:x.owner_name}));state.tasks=tasks.map(x=>({...x,ownerEmail:x.owner,owner:x.owner_name,restricted:!!x.restricted}));stale=false;render()}
async function save(type,arg,f){if(busy)return;setBusy(true);const d=Object.fromEntries(f.entries());const submit=document.querySelector('#entryform button[type=submit]');const label=submit.textContent;submit.textContent='Salvando…';submit.disabled=true;try{
 if(type.startsWith('edit-')){const entity=type.slice(5),x=state[entities[entity]][arg];await api(entity+'/'+encodeURIComponent(x.id),'PATCH',{...d,edit:true,version:x.version,...(entity==='tasks'?{restricted:d.visibility==='Restrita',owner:d.owner}:{ }),...(entity==='xerox'?{copies:Number(d.copies)}:{}),...(entity==='fixed-occupancy'?{weekday:Number(d.weekday)}:{})})}
 else if(type==='new-fixed')await api('fixed-occupancy','POST',{...d,weekday:Number(d.weekday)});
 else if(type==='new-booking')await api('reservations','POST',d);
 else if(type==='new-task')await api('tasks','POST',{title:d.title,due:d.due,owner:d.owner,restricted:d.visibility==='Restrita'});
 else if(type==='task')await api('tasks/'+encodeURIComponent(state.tasks[arg].id),'PATCH',{...d,version:state.tasks[arg].version});
 else if(type==='new-sub')await api('substitutions','POST',d);
 else if(type==='assign')await api('substitutions/'+encodeURIComponent(state.subs[arg].id),'PATCH',{auxiliary:d.auxiliary,version:state.subs[arg].version});
 else if(type==='new-aux')await api('auxiliaries','POST',d);
 else if(type==='new-xerox')await api('xerox','POST',{...d,copies:Number(d.copies)});
 else if(type==='revise-xerox')await api('xerox/'+encodeURIComponent(state.xerox[arg].id),'PATCH',{...d,copies:Number(d.copies),resubmit:true,version:state.xerox[arg].version});
 else if(type==='xerox')await api('xerox/'+encodeURIComponent(state.xerox[arg].id),'PATCH',{...d,version:state.xerox[arg].version});
 else if(type==='new-minute')await api('minutes','POST',d);
 else if(type==='new-event')await api('events','POST',d);
 else throw new Error('Módulo indisponível');
 closeModal(true);toast('Registro salvo.');try{await refresh()}catch{markStale()}
}catch(e){error(e.message)}finally{setBusy(false);if(submit.isConnected){submit.disabled=false;submit.textContent=label}}}
function userPicker(owner=currentUser.email){const list=currentUser.role==='direction'?users:[currentUser];return `<label class="field">Responsável<select name="owner" required>${list.map(u=>`<option value="${esc(u.email)}" ${u.email===owner?'selected':''}>${esc(u.name||u.email)}</option>`).join('')}</select></label>`}
const originalFormContent=formContent;
formContent=function(type,arg){if(type==='new-fixed'||type==='edit-fixed-occupancy'){const x=type==='new-fixed'?{space:spaces[0],weekday:1,start:'',end:'',from_date:iso,to_date:iso,purpose:''}:state.fixed[arg];return `<div class="formgrid">${select('space','Espaço',[x.space,...spaces.filter(y=>y!==x.space)])}<label class="field">Dia da semana<select name="weekday">${['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map((v,i)=>`<option value="${i}" ${i===x.weekday?'selected':''}>${v}</option>`).join('')}</select></label>${field('start','Início','time',x.start)}${field('end','Fim','time',x.end)}${field('from_date','Válido a partir de','date',x.from_date)}${field('to_date','Válido até','date',x.to_date)}${field('purpose','Atividade','text',x.purpose,'full')}</div>`}
if(type.startsWith('edit-')){const entity=type.slice(5),x=state[entities[entity]][arg];if(entity==='reservations')return `<div class="formgrid">${select('space','Espaço',[x.space,...spaces.filter(y=>y!==x.space)])}${field('date','Dia','date',x.date)}${field('start','Início','time',x.start)}${field('end','Fim','time',x.end)}${field('purpose','Atividade','text',x.purpose,'full')}</div>`;if(entity==='tasks')return `<div class="formgrid">${field('title','Tarefa','text',x.title,'full')}${userPicker(x.ownerEmail)}${field('due','Prazo','date',x.due)}${select('visibility','Visibilidade',currentUser.role==='direction'?(x.restricted?['Restrita','Toda a equipe']:['Toda a equipe','Restrita']):[x.restricted?'Restrita':'Toda a equipe'])}</div>`;if(entity==='substitutions')return `<div class="formgrid">${field('date','Dia','date',x.date)}${field('teacher','Professor ausente','text',x.teacher)}${field('class','Turma','text',x.class)}${field('start','Início','time',x.start)}${field('end','Fim','time',x.end)}</div>`;if(entity==='auxiliaries')return field('name','Nome da auxiliar','text',x.name);if(entity==='xerox')return `<div class="formgrid">${field('title','Material','text',x.title,'full')}${field('copies','Cópias','number',x.copies)}${field('deadline','Prazo','date',x.deadline)}</div>`;if(entity==='minutes')return `<div class="formgrid">${field('title','Reunião','text',x.title,'full')}${field('date','Dia','date',x.date)}${field('participants','Participantes','text',x.participants,'full')}${field('decisions','Decisões','text',x.decisions,'full')}</div>`;if(entity==='events')return `<div class="formgrid">${field('title','Evento','text',x.title,'full')}${field('date','Dia','date',x.date)}${select('type','Tipo',[x.type,...['Reunião','Dia letivo','Feriado','Recesso','Conselho de classe','Evento escolar'].filter(y=>y!==x.type)])}</div>`}
if(type==='revise-xerox'){const x=state.xerox[arg];return `<div class="formgrid">${field('title','Qual material?','text',x.title,'full')}${field('copies','Quantas cópias?','number',x.copies)}${field('deadline','Precisa para quando?','date',x.deadline)}</div>`}if(type==='new-aux')return field('name','Nome da auxiliar');if(type==='new-sub')return `<div class="formgrid">${field('date','Dia da ausência','date',iso)}${field('teacher','Professor ausente')}${field('class','Turma')}${field('start','Início da aula','time')}${field('end','Fim da aula','time')}</div>`;if(type==='assign'&&!state.aux.length)return '<p class="notice">Cadastre uma auxiliar na tela de substituições antes de distribuir a aula.</p>';if(type==='assign')return `<p>${esc(state.subs[arg].class)} · ${esc(state.subs[arg].slot)}</p><label class="field">Quem vai cobrir?<select name="auxiliary" required>${state.aux.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label>`;if(type==='new-xerox')return `<div class="formgrid">${field('title','Qual material?','text','','full')}${field('copies','Quantas cópias?','number')}${field('deadline','Precisa para quando?','date',iso)}</div>`;if(type==='xerox'){const x=state.xerox[arg];const options={'Aguardando aprovação':['Aprovado','Devolvido para ajustes','Recusado'],'Devolvido para ajustes':['Aguardando aprovação'],'Aprovado':['Em produção'],'Em produção':['Concluído'],'Recusado':[],'Concluído':[]};return `<p>${esc(x.title)} · ${esc(x.status)}</p>${options[x.status].length?select('status','Próxima etapa',options[x.status]):'<p>Pedido encerrado.</p>'}`}if(type==='new-task')return `<div class="formgrid">${field('title','Tarefa','text','','full')}${userPicker()}${field('due','Prazo','date',iso)}${select('visibility','Visibilidade',currentUser.role==='direction'?['Toda a equipe','Restrita']:['Toda a equipe'])}</div>`;if(type==='new-booking')return originalFormContent(type,arg).replace(field('owner','Responsável'),'');return originalFormContent(type,arg)};
const originalModal=modal;modal=function(type,arg){if(busy)return;if(type==='new-aux'){modalAux();return}if(['new-late','new-absence'].includes(type)){toast('Módulo ainda indisponível: nenhum dado será salvo.');return}originalModal(type,arg);document.querySelector('#entryform button[type=submit]').textContent='Salvar';if(type.startsWith('edit-')){const del=document.createElement('button');del.type='button';del.className='button outline';del.textContent=type==='edit-auxiliaries'?'Desativar auxiliar':'Remover registro';del.onclick=()=>removeRecord(type.slice(5),arg);document.querySelector('#entryform .actions').append(del)}if((type==='assign'&&!state.aux.length)||(type==='xerox'&&['Recusado','Concluído'].includes(state.xerox[arg].status)))document.querySelector('#entryform button[type=submit]').disabled=true;focusModal()};
function modalAux(){document.querySelector('#modalroot').innerHTML=`<div class="modalback"><div class="modal" role="dialog" aria-modal="true" aria-label="Cadastrar auxiliar"><h2>Cadastrar auxiliar</h2><form id="entryform">${field('name','Nome da auxiliar')}<div class="actions"><button class="button" type="submit">Cadastrar</button><button class="button outline" type="button" data-close>Cancelar</button></div><p id="formerror" class="alert hidden" role="alert"></p></form></div></div>`;document.querySelector('#entryform').onsubmit=e=>{e.preventDefault();save('new-aux',null,new FormData(e.target))};document.querySelector('[data-close]').onclick=()=>closeModal();focusModal()}
function focusModal(){document.querySelector('.modal input,.modal select')?.focus()}
async function boot(){document.querySelector('#page').innerHTML='<div class="empty" role="status">Carregando sua escola…</div>';try{currentUser=await api('me');users=await api('users');await refresh()}catch(e){document.querySelector('#page').textContent=e.message;document.querySelector('#nav').innerHTML='';document.querySelector('.notice').textContent='Acesso bloqueado até configurar login institucional e autorização nominal.'}}
document.addEventListener('keydown',e=>{if(!document.querySelector('.modal'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});document.addEventListener('click',e=>{lastFocus=e.target;const refreshButton=e.target.closest('[data-refresh]');if(refreshButton)refresh().catch(()=>toast('Ainda não foi possível atualizar. Tente de novo.'));const unassignButton=e.target.closest('[data-unassign]');if(unassignButton)unassign(Number(unassignButton.dataset.unassign));const edit=e.target.closest('[data-edit]');if(edit){const [entity,index]=edit.dataset.edit.split(':');modal('edit-'+entity,Number(index))}const cancel=e.target.closest('[data-cancel-booking]');if(cancel)cancelBooking(cancel.dataset.cancelBooking);const n=e.target.closest('[data-section]');if(n)setPage(n.dataset.section);const a=e.target.closest('[data-action]');if(a){if(pages[a.dataset.action])setPage(a.dataset.action);else modal(a.dataset.action)}const sp=e.target.closest('[data-space]');if(sp)modal('new-booking',sp.dataset.space);const as=e.target.closest('[data-assign]');if(as)modal('assign',Number(as.dataset.assign));const ta=e.target.closest('[data-task]');if(ta)modal('task',Number(ta.dataset.task));const rx=e.target.closest('[data-revise-xerox]');if(rx)modal('revise-xerox',Number(rx.dataset.reviseXerox));const xe=e.target.closest('[data-xerox]');if(xe)modal('xerox',Number(xe.dataset.xerox))});boot();
</script>
