name: Assistant QA
on:
  push:
    branches: [main, 'codex/**']
    paths: ['src/**', 'scripts/assistant-qa.mjs', 'scripts/dev.mjs', 'migrations/**', '.github/workflows/assistant-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install isolated browser
        env:
          ASSISTANT_QA_PLAYWRIGHT_DIR: ${{ runner.temp }}/assistant-playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/assistant-browsers
        run: |
          npm install --prefix "$ASSISTANT_QA_PLAYWRIGHT_DIR" --no-save --package-lock=false playwright@1.64.0
          "$ASSISTANT_QA_PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise assistant with synthetic data
        env:
          ASSISTANT_QA_PLAYWRIGHT_DIR: ${{ runner.temp }}/assistant-playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/assistant-browsers
        run: node scripts/assistant-qa.mjs
