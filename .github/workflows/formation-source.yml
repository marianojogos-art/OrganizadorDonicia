name: Inspect official formation calendars
on:
  push:
    branches: ['codex/calendario-formacao-oficial']
    paths: ['.github/workflows/formation-source.yml', 'scripts/inspect-formation-source.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/inspect-formation-source.mjs
