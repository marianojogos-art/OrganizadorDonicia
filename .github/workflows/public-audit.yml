name: Public live audit
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths:
      - '.github/workflows/public-audit.yml'
      - 'scripts/public-live-audit.mjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated browser
        env:
          PUBLIC_QA_PLAYWRIGHT_DIR: ${{ runner.temp }}/public-qa-playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/public-qa-browsers
        run: |
          npm install --prefix "$PUBLIC_QA_PLAYWRIGHT_DIR" --no-save --package-lock=false playwright@1.64.0
          "$PUBLIC_QA_PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: Read-only production audit
        env:
          PUBLIC_QA_PLAYWRIGHT_DIR: ${{ runner.temp }}/public-qa-playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/public-qa-browsers
        run: node scripts/public-live-audit.mjs
