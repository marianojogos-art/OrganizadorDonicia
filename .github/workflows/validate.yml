name: Validação
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Ensaio SQLite descartável de recuperação com dados fictícios
        run: node scripts/recovery-drill.mjs
      - name: Conferir distribuição do conector
        run: |
          cmp dist/sge-connector.zip distributions/sge-connector/organizador-donicia-sge-1.3.1.zip
          cd distributions/sge-connector
          sha256sum -c organizador-donicia-sge-1.3.1.zip.sha256
      - run: npm run check:cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
  mobile-bundle:
    name: mobile-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile-sge/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mobile-sge
      - run: npm run runtime:check
      - run: npm --prefix mobile-sge run check:bundle
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
