name: Verify public portal

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - '.github/workflows/verify-portal.yml'
      - 'src/public.html'
      - 'src/index.html'
      - 'src/public-assets/**'
      - 'src/worker.mjs'
      - 'scripts/build.mjs'
      - 'src/official-trainings.mjs'
      - 'src/staff-assets/**'

permissions: {}

jobs:
  anonymous-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify public routes and Access redirects without credentials
        shell: bash
        env:
          VERIFY_NEW_DESIGN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://organizadordonicia.carijo.workers.dev';
          const issuer = 'tiny-dew-2c0d.cloudflareaccess.com';
          const verifyDesign = process.env.VERIFY_NEW_DESIGN === 'true';
          if (verifyDesign) {
            // The main push and the existing Cloudflare deployment start independently.
            let ready = false;
            for (let attempt = 0; attempt < 36; attempt++) {
              try {
                const response = await fetch(base + '/', {redirect: 'manual', credentials: 'omit', signal: AbortSignal.timeout(10000)});
                if (response.ok && (await response.text()).includes('/public-assets/site-metrics.js')) { ready = true; break; }
                if (response.body && !response.bodyUsed) await response.body.cancel();
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!ready) throw Error('NEW_PUBLIC_DESIGN_NOT_DEPLOYED');
          }
          const checks = [
            ['/', 200],
            ['/public.html', 200],
            ['/public.js', 200],
            ['/public/api', 200],
            ['/equipe', 302],
            ['/equipe/app.js', 302],
            ['/api/me', 302],
            ['/api/feedback', 302],
            ['/api/feedback/verification-only/history', 302],
            ['/api/site-metrics', 302],
            ['/api/staff-requests', 302],
            ['/api/pedagogical-album', 302],
            ['/api/resource-library', 302],
            ['/api/users', 302],
            ['/index.html', 302],
            ['/app.js', 302],
            ['/sge-connector.zip', 302],
            ['/api/public', 302],
            ['/api/official-trainings', 302],
            ['/equipe/calendarios/formacao-outubro-2026.csv', 302],
          ];
          if (verifyDesign) checks.push(['/public-assets/logo.jpg', 200], ['/public-assets/donicia-2026.png', 200], ['/public-assets/feedback.js', 200], ['/public-assets/feedback.css', 200], ['/public/feedback', 405], ['/public-assets/site-metrics.js', 200], ['/public/metrics', 405]);
          let failed = false;
          if (verifyDesign) {
            const readiness = await fetch(base + '/public/feedback', {method:'HEAD',redirect:'manual',credentials:'omit',signal:AbortSignal.timeout(15000)});
            console.log(readiness.status + ' HEAD /public/feedback');
            if (readiness.status !== 204) failed = true;
            if (readiness.body) await readiness.body.cancel();
            const metricsReadiness = await fetch(base + '/public/metrics', {method:'HEAD',redirect:'manual',credentials:'omit',signal:AbortSignal.timeout(15000)});
            console.log(metricsReadiness.status + ' HEAD /public/metrics');
            if (metricsReadiness.status !== 204) failed = true;
            if (metricsReadiness.body) await metricsReadiness.body.cancel();
          }
          for (const [path, expected] of checks) {
            let response;
            try {
              response = await fetch(base + path, {
                redirect: 'manual',
                credentials: 'omit',
                signal: AbortSignal.timeout(15000),
              });
              console.log(response.status + ' ' + path);
              if (response.status !== expected) {
                failed = true;
                continue;
              }
              if (expected === 302) {
                const location = response.headers.get('location');
                const target = location ? new URL(location, base) : null;
                if (!target || target.protocol !== 'https:' || target.hostname !== issuer) {
                  console.error('INVALID_REDIRECT ' + path);
                  failed = true;
                }
              } else if (path === '/public-assets/logo.jpg') {
                const bytes = new Uint8Array(await response.arrayBuffer());
                if (!response.headers.get('content-type')?.startsWith('image/jpeg') || bytes[0] !== 255 || bytes[1] !== 216) {
                  console.error('INVALID_PUBLIC_LOGO');
                  failed = true;
                }
              } else if (path === '/public-assets/donicia-2026.png') {
                const bytes = new Uint8Array(await response.arrayBuffer());
                if (!response.headers.get('content-type')?.startsWith('image/png') || bytes[0] !== 137 || bytes[1] !== 80 || bytes[2] !== 78 || bytes[3] !== 71) {
                  console.error('INVALID_2026_IDENTITY');
                  failed = true;
                }
              } else if (path === '/public/api') {
                const payload = await response.json();
                const valid = payload && !Array.isArray(payload)
                  && Object.keys(payload).sort().join(',') === 'events,notices,school'
                  && payload.school && typeof payload.school === 'object'
                  && !Array.isArray(payload.school)
                  && Array.isArray(payload.notices) && Array.isArray(payload.events);
                if (payload?.school?.whatsapp_secretaria !== '554888734629' || payload?.school?.whatsapp_orientacao) {console.error('UNEXPECTED_WHATSAPP_CONFIGURATION');failed = true;}
                if (!valid) {
                  console.error('INVALID_PUBLIC_SHAPE ' + path);
                  failed = true;
                }
              }
            } catch {
              console.error('FETCH_ERROR ' + path);
              failed = true;
            } finally {
              if (response?.body && !response.bodyUsed) await response.body.cancel().catch(() => {});
            }
          }
          if (failed) process.exitCode = 1;
          
          NODE
