name: Public design QA
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/public-design-qa.yml'
      - 'src/public.html'
      - 'src/public-assets/**'
      - 'src/worker.mjs'
      - 'scripts/build.mjs'
      - 'scripts/dev.mjs'
      - 'scripts/public-design-qa.mjs'
permissions:
  contents: read
concurrency:
  group: public-design-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-design:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated visual QA browser
        env:
          PUBLIC_QA_PLAYWRIGHT_DIR: ${{ runner.temp }}/public-qa-playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/public-qa-browsers
        run: |
          npm install --prefix "$PUBLIC_QA_PLAYWRIGHT_DIR" --no-save --package-lock=false playwright@1.64.0
          "$PUBLIC_QA_PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: Inspect synthetic public page at four viewport widths
        env:
          PUBLIC_QA_PLAYWRIGHT_DIR: ${{ runner.temp }}/public-qa-playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/public-qa-browsers
        run: node scripts/public-design-qa.mjs
